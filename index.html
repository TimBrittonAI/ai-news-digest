<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatches: AI by Tim Britton</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0f0f0f;
            --paper: #f5f2ed;
            --accent: #c8432a;
            --muted: #888;
            --rule: #d8d4cd;
            --card-bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            min-height: 100vh;
        }

        .masthead {
            border-bottom: 3px solid var(--ink);
            padding: 0 40px;
            background: var(--paper);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .masthead-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0 12px;
            gap: 20px;
        }

        .masthead-left { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }

        .title {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 2.4rem;
            letter-spacing: -0.02em;
            line-height: 1;
            white-space: nowrap;
        }

        .title span { color: var(--accent); }

        .byline {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: right;
        }

        .masthead-right {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .masthead-date {
            font-family: 'DM Mono', monospace;
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .past-issues-btn {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            background: none;
            border: 1px solid var(--rule);
            padding: 5px 10px;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
            white-space: nowrap;
        }

        .past-issues-btn:hover { color: var(--accent); border-color: var(--accent); }
        .past-issues-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(200, 67, 42, 0.05); }

        .past-issues-panel {
            display: none;
            position: absolute;
            top: 100%;
            right: 40px;
            width: 260px;
            background: var(--card-bg);
            border: 1px solid var(--rule);
            border-top: 3px solid var(--accent);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            z-index: 200;
            max-height: 400px;
            overflow-y: auto;
        }

        .past-issues-panel.open { display: block; }

        .past-issues-header { padding: 12px 16px; border-bottom: 1px solid var(--rule); }
        .past-issues-header-label { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
        .past-issues-header-title { font-family: 'Playfair Display', serif; font-size: 0.95rem; font-weight: 700; color: var(--ink); }
        .past-issues-list { padding: 8px 0; }

        .past-issue-item {
            display: block; width: 100%; text-align: left; padding: 10px 16px;
            background: none; border: none; cursor: pointer;
            font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 300; color: var(--ink);
            border-left: 3px solid transparent; transition: background 0.1s, border-color 0.1s;
        }
        .past-issue-item:hover { background: #faf9f7; border-left-color: var(--accent); }
        .past-issue-item.current { border-left-color: var(--accent); color: var(--accent); font-weight: 400; }

        .past-issues-empty { padding: 16px; font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }

        .past-issue-banner { display: none; background: var(--ink); color: var(--paper); padding: 8px 40px; text-align: center; }
        .past-issue-banner.visible { display: block; }
        .past-issue-banner-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 16px; }
        .past-issue-banner-text { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: #aaa; }
        .past-issue-banner-date { font-family: 'Playfair Display', serif; font-size: 0.9rem; font-weight: 700; color: var(--paper); }
        .back-to-today { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); background: none; border: 1px solid var(--accent); padding: 4px 10px; cursor: pointer; transition: background 0.15s; }
        .back-to-today:hover { background: rgba(200,67,42,0.15); }

        .hero-band { background: var(--ink); color: var(--paper); padding: 10px 40px; }
        .hero-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 24px; }
        .hero-label { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
        .hero-desc { font-size: 0.85rem; color: #aaa; font-weight: 300; }
.nav-panel {
    position: sticky;
    top: 80px;
    z-index: 99;
    background: var(--paper);
    padding-bottom: 4px;
}

   .nav-panel-inner {
    background: var(--card-bg);
    border: 1px solid var(--rule);
    border-left: 4px solid var(--accent);
    padding: 14px 20px;
    margin: 0 0 20px 0;
    display: flex;
    align-items: center;
    gap: 32px;
}

        .nav-panel-label {
            font-family: 'DM Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent);
            white-space: nowrap;
        }
.nav-panel-links {
    display: flex;
    gap: 28px;
    flex-wrap: nowrap;
}
        .nav-panel-link {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--accent);
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: opacity 0.15s;
}
