name: Process Feedback
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Process pending votes and extract topics
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, base64

          REPO = 'TimBrittonAI/ai-news-digest'
          TOKEN = os.environ['GITHUB_TOKEN']

          def github_get(path):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{REPO}/contents/{path}',
                  headers={
                      'Authorization': f'token {TOKEN}',
                      'Accept': 'application/vnd.github.v3+json',
                      'User-Agent': 'signal-news-worker'
                  }
              )
              with urllib.request.urlopen(req) as res:
                  return json.loads(res.read())

          def github_put(path, content, sha, message):
              payload = json.dumps({
                  'message': message,
                  'content': base64.b64encode(content.encode()).decode(),
                  'sha': sha
              }).encode()
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{REPO}/contents/{path}',
                  data=payload,
                  method='PUT',
                  headers={
                      'Authorization': f'token {TOKEN}',
                      'Accept': 'application/vnd.github.v3+json',
                      'Content-Type': 'application/json',
                      'User-Agent': 'signal-news-worker'
                  }
              )
              with urllib.request.urlopen(req) as res:
                  return json.loads(res.read())

          # Load pending votes from GitHub API
          pending_file = github_get('pending-votes.json')
          pending = json.loads(base64.b64decode(pending_file['content'].replace('\n', '')))

          if not pending:
              print("No pending votes to process")
              exit(0)

          # Load existing feedback from GitHub API
          feedback_file = github_get('feedback.json')
          feedback = json.loads(base64.b64decode(feedback_file['content'].replace('\n', '')))

          api_key = os.environ['ANTHROPIC_API_KEY']
          for vote in pending:
              title = vote.get('title', '')
              direction = vote.get('direction', '')
              if not title or not direction:
                  continue
              payload = json.dumps({
                  "model": "claude-haiku-4-5-20251001",
                  "max_tokens": 60,
                  "messages": [{
                      "role": "user",
                      "content": f'Return a JSON array of 2-3 short topic tags for this headline. Return only the JSON array: "{title}"'
                  }]
              }).encode()
              req = urllib.request.Request(
                  'https://api.anthropic.com/v1/messages',
                  data=payload,
                  headers={
                      'Content-Type': 'application/json',
                      'x-api-key': api_key,
                      'anthropic-version': '2023-06-01'
                  }
              )
              try:
                  with urllib.request.urlopen(req) as res:
                      data = json.loads(res.read())
                      topics = json.loads(data['content'][0]['text'])
                      score = 1 if direction == 'up' else -1
                      for topic in topics:
                          feedback['topic_votes'][topic] = feedback['topic_votes'].get(topic, 0) + score
                      print(f"Processed: {title} -> {topics} ({direction})")
              except Exception as e:
                  print(f"Failed for '{title}': {e}")

          # Write feedback.json via API
          github_put('feedback.json', json.dumps(feedback, indent=2), feedback_file['sha'], 'Update feedback.json')
          print("Saved feedback.json")

          # Clear pending-votes.json via API
          github_put('pending-votes.json', json.dumps([], indent=2), pending_file['sha'], 'Clear pending votes')
          print("Cleared pending-votes.json")

          print("Done")
          PYEOF
