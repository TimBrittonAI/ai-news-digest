name: Update ElevenLabs Knowledge Base

on:
  schedule:
    - cron: '58 6 * * *'
  workflow_dispatch:

jobs:
  update-knowledge-base:
    runs-on: ubuntu-latest
    steps:
      - name: Push digest to ElevenLabs and link to agent
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          DIGEST=$(curl -sf "https://raw.githubusercontent.com/TimBrittonAI/ai-news-digest/main/digest-${DATE}.json")
          if [ -z "$DIGEST" ]; then
            echo "No digest found for ${DATE}"
            exit 1
          fi
          TEXT=$(echo "$DIGEST" | jq -r '[.top_stories[]? | .title, .summary, .url], [.further_links[]? | .title, .summary, .url] | .[]' | tr '\n' ' ')
          PAYLOAD=$(jq -n --arg text "$TEXT" --arg name "Signal digest ${DATE}" '{"text":$text,"name":$name}')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.elevenlabs.io/v1/convai/knowledge-base/text" \
            -H "xi-api-key: $ELEVENLABS_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "$RESPONSE"
          DOC_ID=$(echo "$RESPONSE" | head -1 | jq -r '.id')
          if [ -z "$DOC_ID" ] || [ "$DOC_ID" = "null" ]; then
            echo "Failed to get document ID from ElevenLabs response"
            exit 1
          fi
          echo "Document ID: $DOC_ID"
          AGENT_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.elevenlabs.io/v1/convai/agents/agent_5301kkc9q2dqfyh98f5791dep1w4/add-to-knowledge-base" \
            -H "xi-api-key: $ELEVENLABS_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"$DOC_ID\"}")
          echo "$AGENT_RESPONSE"
