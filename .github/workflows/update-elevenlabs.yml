name: Update ElevenLabs Knowledge Base

on:
  schedule:
    - cron: '58 6 * * *'
  workflow_dispatch:

jobs:
  update-knowledge-base:
    runs-on: ubuntu-latest
    steps:
      - name: Push digest to ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          DIGEST=$(curl -sf "https://raw.githubusercontent.com/TimBrittonAI/ai-news-digest/main/digest-${DATE}.json")
          if [ -z "$DIGEST" ]; then
            echo "No digest found for ${DATE}"
            exit 1
          fi
          TEXT=$(echo "$DIGEST" | python3 -c "
import json,sys
data=json.load(sys.stdin)
out=[]
for s in data.get("top_stories",[]):
    out.append(s.get("title",""))
    out.append(s.get("summary",""))
    out.append(s.get("url",""))
for l in data.get("further_links",[]):
    out.append(l.get("title",""))
    out.append(l.get("summary",""))
    out.append(l.get("url",""))
print("\n".join(out))
")
          PAYLOAD=$(python3 -c "import json,sys; t=sys.stdin.read(); print(json.dumps({"text":t,"name":"Signal digest ${DATE}"}))" <<< "$TEXT")
          curl -s -X POST "https://api.elevenlabs.io/v1/convai/knowledge-base/text" \
            -H "xi-api-key: $ELEVENLABS_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
          echo "Done"